<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Contact</title>
        <!-- SEO META TAGS -->
        <meta name="author" content="Gian"/>
        <meta name="description" content="contact information"/>
    </head>
    <body>
        <header>
            <img src="image.com" alt="image of the company logo"/>
            <!-- NAVIGATION -->
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="articles.html">Articles</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <hr>
            <h1>Contact Information</h1>
            <p>Get in contact</p>
        </header>
        <main>
            <hr>
            <section class="contact-info">
                <h2>Get in touch with me</h2>
                <p>Feel free to reach out via email or connect with me on social platforms.</p>
                <address>
                    <p>Email: <a href="mailto:gian@example.com">gian@example.com</a></p>
                    <p>Location: Null</p>
                </address>
            </section>

            <section class="contact-info-form">
                <h2>Send a Message</h2>
                <form action="#" method="POST" class="contact-form">
                    <p>
                        <label for="user-name">Name:</label>
                        <input type="text" id="user-name" name="name" required placeholder="Your Name"/>
                    </p>

                    <p>
                        <label for="user-email">Email:</label>
                        <input type="text" id="user-email" name="email" required placeholder="youremail@email.com"/>
                    </p>

                    <p>
                        <label for="user-message">Message:</label>
                        <textarea id="user-message" name="message" rows="5" required placeholder="Intput your message here..."></textarea>
                    </p>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </main>
    </body>
</html>
